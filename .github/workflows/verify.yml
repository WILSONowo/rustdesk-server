name: Verify API handshake
on:
  push:
    branches: [master, 'feature/**']
    tags: ['*beta*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handshake:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sh scripts/build-api-local.sh
