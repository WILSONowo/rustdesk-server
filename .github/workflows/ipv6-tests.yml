name: Server regression tests
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: sqlite://${{ github.workspace }}/db_v2.sqlite3
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      SODIUM_USE_PKG_CONFIG: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libsodium-dev libclang-dev libsqlite3-dev
      - name: Build and test real server signaling
        run: cargo test --locked -p hbbs --all-targets -- --test-threads=1
      - name: Clippy
        run: cargo clippy --locked -p hbbs --all-targets
