name: Fork release
on:
  push:
    tags: ['*-beta*']
  workflow_dispatch:
    inputs:
      publish_images:
        description: Push the reviewed versioned images to GHCR
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require a matching release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$GITHUB_REF_TYPE" = tag
          python3 - <<'PY'
          import os, tomllib
          version = tomllib.load(open('Cargo.toml', 'rb'))['package']['version']
          assert os.environ['RELEASE_TAG'] == version
          PY
  linux:
    needs: version
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, target: x86_64-unknown-linux-musl, deb: amd64}
          - {arch: arm64v8, target: aarch64-unknown-linux-musl, deb: arm64}
          - {arch: armv7, target: armv7-unknown-linux-musleabihf, deb: armhf}
          - {arch: i386, target: i686-unknown-linux-musl, deb: i386}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: server-${{ matrix.target }}
      - run: cargo install cross --version 0.2.5 --locked
      - run: cross build --locked --release --all-features --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - name: Package upstream Linux formats
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
          DEB_ARCH: ${{ matrix.deb }}
        run: |
          sudo apt-get update
          sudo apt-get install -y zip debhelper
          mkdir -p "$ARCH" release-assets debian-build/package/bin
          cp "target/$TARGET/release/"{hbbs,hbbr,rustdesk-utils} "$ARCH/"
          zip -qr "release-assets/rustdesk-server-linux-$ARCH.zip" "$ARCH"
          cp "$ARCH/"* debian-build/package/bin/
          cp -a debian systemd debian-build/package/
          sed "s/{{ ARCH }}/$DEB_ARCH/" debian/control.tpl > debian-build/package/debian/control
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          DEB_VERSION=${VERSION/-beta/~beta}
          if [ "$DEB_ARCH" != amd64 ]; then sudo apt-get install -y "crossbuild-essential-$DEB_ARCH"; fi
          printf 'rustdesk-server (%s) unstable; urgency=medium\n\n  * Package release build.\n\n -- GitHub Actions <actions@github.com>  %s\n' "$DEB_VERSION" "$(date -R)" > debian-build/package/debian/changelog
          (cd debian-build/package && dpkg-buildpackage -us -uc -b -d -a"$DEB_ARCH")
          cp debian-build/*.deb release-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-${{ matrix.arch }}
          path: ${{ matrix.arch }}/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: server-release-${{ matrix.arch }}
          path: release-assets/
          if-no-files-found: error
  windows:
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            ui -> target
      - run: cargo build --locked --release --all-features --target x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build upstream Windows UI
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          Push-Location ui/html
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location ui
          cargo build --locked --release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force setup/bin,setup/logs,SignOutput | Out-Null
          Copy-Item ../target/x86_64-pc-windows-msvc/release/*.exe setup/bin/
          Copy-Item target/release/*.exe setup/
          & 'C:/Program Files (x86)/NSIS/makensis.exe' /V1 "/DRELEASE_VERSION=$env:RELEASE_TAG" setup.nsi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item RustDeskServer.Setup.exe SignOutput/
          Copy-Item ../target/x86_64-pc-windows-msvc/release/hbbs.exe,../target/x86_64-pc-windows-msvc/release/hbbr.exe,../target/x86_64-pc-windows-msvc/release/rustdesk-utils.exe SignOutput/
          Pop-Location
          New-Item -ItemType Directory -Force x86_64,release-assets | Out-Null
          Copy-Item ui/SignOutput/* x86_64/
          Compress-Archive -Path x86_64 -DestinationPath release-assets/rustdesk-server-windows-x86_64-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: server-release-windows
          path: release-assets/
          if-no-files-found: error
  draft:
    if: ${{ !inputs.publish_images }}
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          pattern: server-release-*
          merge-multiple: true
          path: release-assets
      - name: Prepare complete draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/draft-release.py --tag "$RELEASE_TAG" --assets release-assets --expected 17
  images:
    needs: linux
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, platform: linux/amd64, s6: x86_64}
          - {arch: arm64v8, platform: linux/arm64, s6: aarch64}
          - {arch: armv7, platform: linux/arm/v7, s6: armhf}
          - {arch: i386, platform: linux/386, s6: i686}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binaries-linux-${{ matrix.arch }}
          path: docker/rootfs/usr/bin
      - uses: docker/setup-qemu-action@v3
      - name: Build both image variants from these binaries
        env:
          PLATFORM: ${{ matrix.platform }}
          S6_ARCH: ${{ matrix.s6 }}
        run: |
          chmod +x docker/rootfs/usr/bin/*
          cp docker/rootfs/usr/bin/{hbbs,hbbr} docker-classic/
          docker build --platform "$PLATFORM" --build-arg "S6_ARCH=$S6_ARCH" -t fork-server-s6 docker
          docker build --platform "$PLATFORM" -t fork-server-classic docker-classic
          mkdir image-assets
          docker save fork-server-s6 fork-server-classic | gzip > image-assets/server-images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: server-images-${{ matrix.arch }}
          path: image-assets/
      - uses: docker/login-action@v3
        if: inputs.publish_images
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push reviewed version only
        if: inputs.publish_images
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          OWNER=${GITHUB_REPOSITORY_OWNER,,}
          docker tag fork-server-s6 "ghcr.io/$OWNER/rustdesk-server-s6:$RELEASE_TAG-$ARCH"
          docker tag fork-server-classic "ghcr.io/$OWNER/rustdesk-server:$RELEASE_TAG-$ARCH"
          docker push "ghcr.io/$OWNER/rustdesk-server-s6:$RELEASE_TAG-$ARCH"
          docker push "ghcr.io/$OWNER/rustdesk-server:$RELEASE_TAG-$ARCH"
  manifests:
    if: inputs.publish_images
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - name: Publish version manifests without moving latest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          OWNER=${GITHUB_REPOSITORY_OWNER,,}
          for IMAGE in rustdesk-server rustdesk-server-s6; do
            BASE="ghcr.io/$OWNER/$IMAGE:$RELEASE_TAG"
            docker buildx imagetools create -t "$BASE" "$BASE-amd64" "$BASE-arm64v8" "$BASE-armv7" "$BASE-i386"
          done
