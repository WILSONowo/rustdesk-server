name: rustdesk-handshake-local
services:
  hbbs:
    image: rustdesk-hbbs:1.1.16-beta1-local
    command: ["hbbs", "-k", "_", "-r", "127.0.0.1:21127"]
    ports:
      - "127.0.0.1:21125:21115/tcp"
      - "127.0.0.1:21126:21116/tcp"
      - "127.0.0.1:21126:21116/udp"
      - "127.0.0.1:21128:21118/tcp"
    volumes:
      - handshake-data:/root
    healthcheck:
      test: ["CMD-SHELL", "test -s /root/id_ed25519 && test -s /root/id_ed25519.pub"]
      interval: 2s
      timeout: 1s
      retries: 10
  hbbr:
    image: rustdesk/rustdesk-server@sha256:8ecdab65deb7c84652a626380e31d11a8f1fbafd97916d57f95c20628f943c00
    command: ["hbbr", "-k", "_"]
    depends_on:
      hbbs:
        condition: service_healthy
    ports:
      - "127.0.0.1:21127:21117/tcp"
      - "127.0.0.1:21129:21119/tcp"
    volumes:
      - handshake-data:/root
volumes:
  handshake-data:
